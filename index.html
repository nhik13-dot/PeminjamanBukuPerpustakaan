<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peminjaman & Pengembalian Buku SMAN 1 Kalibunder</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Library QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Background Kuning Muda dengan Gradasi Halus */
        body {
            background: linear-gradient(135deg, #fffde7 0%, #fff59d 50%, #ffee58 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container Card Utama Transparan (Glassmorphism) */
        .container {
            position: relative;
            background: rgba(255, 255, 255, 0.45); /* Transparan agar watermark terlihat jelas */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3), 0 4px 10px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Watermark Tag <img> di Tengah */
        .watermark-img {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: auto;
            opacity: 0.25; /* Tingkat transparansi watermark agar jelas terlihat */
            pointer-events: none;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        /* Header Title */
        .header-title {
            text-align: center;
            color: #2c3e50;
            font-size: 17px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 22px;
            line-height: 1.4;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 3px solid #fbc02d;
            padding-bottom: 12px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            padding-top: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 6px;
            color: #222222;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        /* Form Input Dibuat Transparan */
        input[type="text"], select {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background-color: rgba(255, 255, 255, 0.5); /* Transparan */
            color: #111111;
            font-weight: 600;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: #fbc02d;
            background-color: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 10px rgba(251, 192, 45, 0.4);
        }

        /* Scanner Camera Box Transparan */
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px dashed #fbc02d;
            background: rgba(255, 255, 255, 0.35); /* Transparan */
            backdrop-filter: blur(4px);
        }

        #reader video {
            border-radius: 10px;
        }

        /* Tombol Transparan Bergradasi */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, rgba(251, 192, 45, 0.9) 0%, rgba(245, 127, 23, 0.9) 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(245, 127, 23, 0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, rgba(251, 192, 45, 1) 0%, rgba(245, 127, 23, 1) 100%);
            box-shadow: 0 6px 20px rgba(245, 127, 23, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background: rgba(220, 220, 220, 0.7);
            color: #888888;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Result Message Box */
        .result-box {
            margin-top: 18px;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            white-space: pre-line;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.4s ease-in-out;
        }

        .success {
            background-color: rgba(232, 245, 233, 0.9);
            color: #1b5e20;
            border: 1px solid #a5d6a7;
        }

        .error {
            background-color: rgba(255, 235, 238, 0.9);
            color: #b71c1c;
            border: 1px solid #ef9a9a;
        }

        .hidden { 
            display: none; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Watermark Menggunakan Sintaks <img> -->
        <img src="SMA.png" alt="Watermark SMAN 1 Kalibunder" class="watermark-img">

        <div class="content">
            <!-- Judul Utama -->
            <h1 class="header-title">
                Peminjaman dan Pengembalian Buku Perpustakaan SMAN 1 Kalibunder
            </h1>

            <!-- 1. Area Scan QR Code -->
            <div class="form-group">
                <label>1. Scan QR Code Kartu:</label>
                <div id="reader"></div>
            </div>

            <!-- ID Anggota (Otomatis Terisi) -->
            <div class="form-group">
                <label for="idInput">ID Murid (Terisi Otomatis):</label>
                <input type="text" id="idInput" placeholder="Hasil scan ID akan muncul di sini..." readonly style="background-color: rgba(230, 230, 230, 0.6); color: #333333;">
            </div>

            <!-- 2. Input Identitas / Judul Buku -->
            <div class="form-group">
                <label for="bukuInput">2. Identitas / Judul Buku:</label>
                <input type="text" id="bukuInput" placeholder="Masukkan judul atau kode buku..." required>
            </div>

            <!-- 3. Status Transaksi -->
            <div class="form-group">
                <label for="aksiSelect">3. Pilih Status Transaksi:</label>
                <select id="aksiSelect">
                    <option value="pinjam">📖 Meminjam Buku</option>
                    <option value="kembali">🔄 Mengembalikan Buku</option>
                </select>
            </div>

            <!-- 4. Tombol Kirim -->
            <button id="btnKirim" class="btn-submit" onclick="kirimData()">Kirim Data</button>

            <!-- Box Pesan Result -->
            <div id="result" class="result-box hidden"></div>
        </div>
    </div>

    <script>
        // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwKg_SKWVE0XiCRig6CisKamChn9OZLbE8wyuX2htRt3vgLvH3olN6hzu5w8x5L_Q2R/exec";

        function showMessage(msg, className) {
            const res = document.getElementById('result');
            res.className = 'result-box ' + className;
            res.innerText = msg;
        }

        // Event handler saat QR Code berhasil ter-scan
        function onScanSuccess(decodedText) {
            const scannedId = decodedText.trim();
            if (scannedId) {
                document.getElementById('idInput').value = scannedId;
                showMessage('✅ QR ID Anggota Berhasil Di-scan!\nSilakan isi Judul Buku & pilih Status, lalu tekan Kirim Data.', 'success');
            }
        }

        // Function Kirim Data Ke Google Sheets
        function kirimData() {
            const idAnggota = document.getElementById('idInput').value.trim();
            const buku = document.getElementById('bukuInput').value.trim();
            const aksi = document.getElementById('aksiSelect').value;
            const btn = document.getElementById('btnKirim');

            if (!idAnggota) {
                showMessage('⚠️ Harap scan QR Code Kartu Anggota terlebih dahulu!', 'error');
                return;
            }

            if (!buku) {
                showMessage('⚠️ Harap masukkan Identitas / Judul Buku terlebih dahulu!', 'error');
                return;
            }

            btn.disabled = true;
            showMessage('⏳ Memproses data ke Google Sheets...', 'success');

            const payload = {
                idAnggota: idAnggota,
                buku: buku,
                aksi: aksi
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                const jenisAksi = aksi === 'pinjam' ? 'Peminjaman' : 'Pengembalian';
                showMessage(`🎉 [${jenisAksi.toUpperCase()} BERHASIL]\nID Anggota: ${idAnggota}\nBuku: ${buku}\n\nData telah berhasil dicatat ke Google Sheets.`, 'success');
                
                // Reset Form
                document.getElementById('idInput').value = '';
                document.getElementById('bukuInput').value = '';
                document.getElementById('aksiSelect').value = 'pinjam';
            })
            .catch(err => {
                showMessage('❌ Gagal mengirim data: ' + err.message, 'error');
            })
            .finally(() => {
                btn.disabled = false;
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            let html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { fps: 10, qrbox: { width: 220, height: 220 } },
                false
            );
            html5QrcodeScanner.render(onScanSuccess);
        });
    </script>
</body>
</html>
